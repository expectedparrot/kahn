[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kahn"
version = "0.1.0"
description = "Strategic scenario planning CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Expected Parrot, Inc." }
]
keywords = ["scenario-planning", "strategy", "decision-making", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = [
  "edsl @ git+https://github.com/expectedparrot/edsl.git@main",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://expectedparrot.github.io/kahn/"
Documentation = "https://expectedparrot.github.io/kahn/"
Repository = "https://github.com/expectedparrot/kahn"
Issues = "https://github.com/expectedparrot/kahn/issues"

[project.scripts]
kahn = "kahn.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["kahn*"]

[tool.setuptools.package-data]
kahn = ["docs_content/*.md"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Advisory while legacy command dictionaries and Typer-to-Literal boundaries
# are annotated incrementally; unlike Ruff and pytest, this is not a hard gate.
